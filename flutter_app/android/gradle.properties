# Keep cloud/low-memory builds predictable. GitHub runners have ample capacity,
# while this also avoids an 8 GB daemon on small development environments.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
