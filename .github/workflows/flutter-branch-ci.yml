name: Flutter branch CI

# Verification for feature branches. It keeps the developer machine free of the
# Flutter toolchain: the runner formats and auto-fixes the Dart code, pushes the
# result back to the branch, then analyzes, tests, and builds an installable
# signed APK artifact for phone verification. Releases are still only produced
# by android-apk.yml when changes land on main.

on:
  push:
    branches-ignore: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-branch-ci.yml"
      - ".github/scripts/report_failure.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, test, and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply automatic lint fixes
        run: dart fix --apply

      - name: Format source
        run: dart format lib test

      - name: Commit formatting and lint fixes back to the branch
        id: autofix
        run: |
          if git diff --quiet; then
            echo "No formatting or lint fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib test pubspec.lock
          git commit -m "style: apply dart fix and dart format (CI)"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Pushed formatting fixes."
          else
            echo "::warning::Branch moved during the run; formatting fixes will be re-applied on the next run."
          fi

      # Analyzer, test and build failures are re-emitted as check annotations
      # and as a commit comment (.github/scripts/report_failure.py) so they can
      # be read through the GitHub API without downloading the raw logs.
      # GitHub's default step shell is `bash -e` WITHOUT pipefail, so a
      # `cmd | tee` pipeline would report tee's exit code; pipefail keeps the
      # analyzer/test/build status honest.
      - name: Analyze source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if flutter analyze --fatal-infos 2>&1 | tee analyze.log; then exit 0; fi
          python3 ../.github/scripts/report_failure.py analyze analyze.log
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input failure-comment.json --silent || echo "::warning::Could not post the commit comment"
          exit 1

      - name: Install SQLite for database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Run tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if flutter test --reporter expanded 2>&1 | tee test.log; then exit 0; fi
          python3 ../.github/scripts/report_failure.py test test.log
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input failure-comment.json --silent || echo "::warning::Could not post the commit comment"
          exit 1

      # versionCode is minutes since the epoch so that branch builds and main
      # releases always increase together and can be installed as updates over
      # each other without uninstalling.
      - name: Build signed universal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if flutter build apk --release \
              --dart-define-from-file=config/production.json \
              --dart-define=APP_BUILD=1.1.${{ github.run_number }} \
              --build-name=1.1.${{ github.run_number }} \
              --build-number=$(( $(date +%s) / 60 )) 2>&1 | tee build.log; then
            exit 0
          fi
          python3 ../.github/scripts/report_failure.py build build.log
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" --input failure-comment.json --silent || echo "::warning::Could not post the commit comment"
          exit 1

      - name: Name APK for download
        run: cp build/app/outputs/flutter-apk/app-release.apk "Lab-Wizard-Android-branch-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-Wizard-Android-branch-${{ github.run_number }}
          path: flutter_app/Lab-Wizard-Android-branch-${{ github.run_number }}.apk
          retention-days: 7
          if-no-files-found: error
