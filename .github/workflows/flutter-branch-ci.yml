name: Flutter branch CI

# Verification for feature branches. It keeps the developer machine free of the
# Flutter toolchain: the runner formats and auto-fixes the Dart code, pushes the
# result back to the branch, then analyzes, tests, and builds an installable
# signed APK artifact for phone verification. Releases are still only produced
# by android-apk.yml when changes land on main.

on:
  push:
    branches-ignore: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-branch-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, analyze, test, and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply automatic lint fixes
        run: dart fix --apply

      - name: Format source
        run: dart format lib test

      - name: Commit formatting and lint fixes back to the branch
        id: autofix
        run: |
          if git diff --quiet; then
            echo "No formatting or lint fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib test
          git commit -m "style: apply dart fix and dart format (CI)"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Pushed formatting fixes."
          else
            echo "::warning::Branch moved during the run; formatting fixes will be re-applied on the next run."
          fi

      - name: Analyze source
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      # versionCode is minutes since the epoch so that branch builds and main
      # releases always increase together and can be installed as updates over
      # each other without uninstalling.
      - name: Build signed universal APK
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/production.json
          --build-name=1.1.${{ github.run_number }}
          --build-number=$(( $(date +%s) / 60 ))

      - name: Name APK for download
        run: cp build/app/outputs/flutter-apk/app-release.apk "Lab-Wizard-Android-branch-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-Wizard-Android-branch-${{ github.run_number }}
          path: flutter_app/Lab-Wizard-Android-branch-${{ github.run_number }}.apk
          retention-days: 7
          if-no-files-found: error
