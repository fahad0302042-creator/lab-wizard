name: Flutter checks

# The APK workflow only runs after a Flutter change reaches main, so a broken
# file was previously discovered after the merge. This runs the same checks on
# every pull request that touches the app.
on:
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
