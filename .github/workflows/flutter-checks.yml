name: Flutter checks

# Checks every pull request that touches either app, and posts the analyzer and
# test output as a pull request comment so the exact errors are readable
# without needing to open the Actions log.
on:
  pull_request:
    paths:
      - "flutter_app/**"
      - "flutter_app_v2/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A malformed workflow file creates zero jobs and fails silently: the run
  # goes red with no steps, no APK and nothing to read. That is exactly how a
  # stray newline inside a run block cost a build. This job parses every
  # workflow file so the mistake is caught by name instead.
  workflow-files:
    name: Check workflow files parse
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          failed = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  document = yaml.safe_load(open(path))
              except Exception as error:
                  failed.append(f"{path}: {error}")
                  continue
              if not isinstance(document, dict) or "jobs" not in document:
                  failed.append(f"{path}: no jobs:")
                  continue
              for job in document["jobs"].values():
                  steps = job.get("steps")
                  if not steps:
                      failed.append(f"{path}: a job has no steps")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          print("all workflow files parse")
          PY

  checks:
    name: Check ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [flutter_app, flutter_app_v2]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Report formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test > "$RUNNER_TEMP/format.txt" 2>&1

      - name: Analyze source
        id: analyze
        continue-on-error: true
        run: flutter analyze --fatal-infos > "$RUNNER_TEMP/analyze.txt" 2>&1

      - name: Run tests
        id: test
        continue-on-error: true
        run: flutter test > "$RUNNER_TEMP/test.txt" 2>&1

      - name: Publish the output to the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          APP: ${{ matrix.app }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.test.outcome }}
        run: |
          {
            echo "### \`$APP\` — analyze: **$ANALYZE**, tests: **$TESTS**"
            echo ""
            echo "<details><summary>flutter analyze</summary>"
            echo ""
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/analyze.txt" 2>/dev/null || echo "no output"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>flutter test</summary>"
            echo ""
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/test.txt" 2>/dev/null || echo "no output"
            echo '```'
            echo ""
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/comment.md"

      - name: Fail if the code does not analyze
        if: steps.analyze.outcome == 'failure'
        run: cat "$RUNNER_TEMP/analyze.txt" && exit 1

      - name: Fail if the tests do not pass
        if: steps.test.outcome == 'failure'
        run: cat "$RUNNER_TEMP/test.txt" && exit 1
