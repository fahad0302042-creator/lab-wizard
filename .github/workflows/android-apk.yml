name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - "flutter_app_v2/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Test, build, and publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Formatting is a style preference, not a correctness gate: it should
      # never be the reason there's no APK to install.
      - name: Report formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build signed universal APK
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/production.json
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Name APK for download
        run: cp build/app/outputs/flutter-apk/app-release.apk "Lab-Wizard-Android-1.0.${{ github.run_number }}.apk"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-Wizard-Android-1.0.${{ github.run_number }}
          path: flutter_app/Lab-Wizard-Android-1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-1.0.${{ github.run_number }}
          APK: Lab-Wizard-Android-1.0.${{ github.run_number }}.apk
        run: |
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest=false \
            --title "Lab Wizard (old app) 1.0.${{ github.run_number }}" \
            --notes "This is the PREVIOUS app, not the rebuilt one. It stays here so both can be installed side by side; the new app is released as Lab Wizard 2 - 2.0.x and is the one marked Latest. Sign in with the same account to load existing Supabase data. This is a GitHub development build, not a Play Store release."

  # The rebuilt app builds and publishes on its own, so a failure in the older
  # app's checks never blocks it. A manual run is allowed to publish too, which
  # is how a test build gets a download link that works on a phone.
  build-v2:
    name: Test, build, and publish Lab Wizard 2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app_v2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Informational only while the rebuild is in progress: formatting should
      # never be the reason there's no APK to install.
      - name: Report formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        id: analyze
        continue-on-error: true
        run: flutter analyze --fatal-infos > "$RUNNER_TEMP/analyze.txt" 2>&1

      - name: Run tests
        id: test
        continue-on-error: true
        run: flutter test > "$RUNNER_TEMP/test.txt" 2>&1

      # Logs aren't always reachable, so a failure files its own report.
      - name: File a report if the checks failed
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "analyze: ${{ steps.analyze.outcome }} · tests: ${{ steps.test.outcome }}"
            echo ""
            echo "## flutter analyze"
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/analyze.txt" 2>/dev/null || echo none
            echo '```'
            echo ""
            echo "## flutter test"
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/test.txt" 2>/dev/null || echo none
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          gh issue create --repo "${{ github.repository }}" \
            --title "Lab Wizard 2 build blocked: checks failed (run ${{ github.run_number }})" \
            --body-file "$RUNNER_TEMP/report.md"

      - name: Fail if the code does not analyze
        if: steps.analyze.outcome == 'failure'
        run: cat "$RUNNER_TEMP/analyze.txt" && exit 1

      - name: Fail if the tests do not pass
        if: steps.test.outcome == 'failure'
        run: cat "$RUNNER_TEMP/test.txt" && exit 1

      - name: Build signed universal APK
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/production.json
          --dart-define=BUILD_LABEL=2.0.${{ github.run_number }}
          --build-name=2.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Name APK for download
        run: cp build/app/outputs/flutter-apk/app-release.apk "Lab-Wizard-2-Android-2.0.${{ github.run_number }}.apk"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-Wizard-2-Android-2.0.${{ github.run_number }}
          path: flutter_app_v2/Lab-Wizard-2-Android-2.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: labwizard2-2.0.${{ github.run_number }}
          APK: Lab-Wizard-2-Android-2.0.${{ github.run_number }}.apk
          BRANCH: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --latest \
            --title "Lab Wizard 2 - 2.0.${{ github.run_number }}" \
            --notes "This is the REBUILT app. After installing, check the build number at the bottom of the sign-in screen (or in Settings): it must match this release, otherwise an older APK is still installed. It installs alongside the old Lab Wizard so both can be compared. Sign in with the same account and your chemicals, history and reports load as before."
