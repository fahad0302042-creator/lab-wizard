name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Test, build, and publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        run: flutter analyze --fatal-infos

      - name: Install SQLite for database tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - name: Run tests
        run: flutter test

      # versionCode is minutes since the epoch (always larger than the earlier
      # run-number based codes) so releases install as updates over any branch
      # verification build from flutter-branch-ci.yml.
      - name: Build signed universal APK
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/production.json
          --build-name=1.0.${{ github.run_number }}
          --build-number=$(( $(date +%s) / 60 ))

      - name: Name APK for download
        run: cp build/app/outputs/flutter-apk/app-release.apk "Lab-Wizard-Android-1.0.${{ github.run_number }}.apk"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-Wizard-Android-1.0.${{ github.run_number }}
          path: flutter_app/Lab-Wizard-Android-1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-1.0.${{ github.run_number }}
          APK: Lab-Wizard-Android-1.0.${{ github.run_number }}.apk
        run: |
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Lab Wizard Android 1.0.${{ github.run_number }}" \
            --notes "Install this APK directly on Android. Allow installs from your browser or GitHub app if Android asks. Sign in with the same Lab Wizard account to load existing Supabase data. This is a GitHub development build, not a Play Store release."
