name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_app_v2/**"
      - ".github/workflows/android-apk.yml"
  # A pull request that touches the app gets its APK built and attached as a
  # run artifact, so a redesign can be installed and felt on a real phone
  # before it lands on main. Branch builds never publish a Release (see the
  # "Latest" guard below), so this cannot become the download the README points
  # at. The full analyze + test gate already runs in the "Flutter checks"
  # workflow, so this one optimises for getting a build to test.
  pull_request:
    paths:
      - "flutter_app_v2/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds and publishes the app. A manual run is allowed to publish too, which
  # is how a test build gets a download link that works on a phone.
  build:
    name: Build and publish Lab Wizard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app_v2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get


      # The APK is built before the analyzer runs. That order is deliberate: the
      # checks are reported and filed as an issue when they fail, but a code
      # problem must never be the reason there is no build to install on a
      # phone and try.
      - name: Build signed universal APK
        run: >-
          flutter build apk --release
          --dart-define-from-file=config/production.json
          --dart-define=BUILD_LABEL=2.0.${{ github.run_number }}
          --build-name=2.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      # QUALITY, reported and filed, never gating the build. The "Flutter
      # checks" workflow owns the hard pass/fail gate on every pull request, so
      # a red analyzer here becomes an issue with the exact output rather than a
      # missing APK.
      - name: Report formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze source
        id: analyze
        continue-on-error: true
        run: flutter analyze --fatal-infos > "$RUNNER_TEMP/analyze.txt" 2>&1

      - name: Run tests
        id: test
        continue-on-error: true
        run: flutter test > "$RUNNER_TEMP/test.txt" 2>&1

      - name: File a report if the checks failed
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "build 2.0.${{ github.run_number }} succeeded and is attached to this run."
            echo ""
            echo "analyze: ${{ steps.analyze.outcome }} · tests: ${{ steps.test.outcome }}"
            echo ""
            echo "## flutter analyze"
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/analyze.txt" 2>/dev/null || echo none
            echo '```'
            echo ""
            echo "## flutter test"
            echo '```'
            tail -c 40000 "$RUNNER_TEMP/test.txt" 2>/dev/null || echo none
            echo '```'
          } > "$RUNNER_TEMP/report.md"
          gh issue create --repo "${{ github.repository }}" \
            --title "Lab Wizard checks need attention (run ${{ github.run_number }})" \
            --body-file "$RUNNER_TEMP/report.md"

      - name: Name APK for download
        run: cp build/app/outputs/flutter-apk/app-release.apk "Lab-Wizard-Android-2.0.${{ github.run_number }}.apk"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lab-Wizard-Android-2.0.${{ github.run_number }}
          path: flutter_app_v2/Lab-Wizard-Android-2.0.${{ github.run_number }}.apk
          if-no-files-found: error

      # Only a build of main may claim the "Latest" badge, because that badge is
      # what the README tells people to download. A manual run on a branch still
      # publishes — that is how a test build gets a link that works on a phone —
      # but it is marked latest=false, so testing the redesign can never become
      # the release everyone is told to install.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: labwizard-2.0.${{ github.run_number }}
          APK: Lab-Wizard-Android-2.0.${{ github.run_number }}.apk
          BRANCH: ${{ github.ref_name }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          LATEST=""
          if [ "$IS_MAIN" = "true" ]; then LATEST="--latest"; fi
          NOTES="Lab Wizard for Android. After installing, check the build number at the bottom of the sign-in screen (or in Settings): it must match this release, otherwise an older build is still installed. Sign in with the same account as the web app."
          if [ "$IS_MAIN" != "true" ]; then
            NOTES="TEST BUILD from branch $BRANCH — not main, so not marked Latest. $NOTES"
          fi
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            $LATEST \
            --title "Lab Wizard — 2.0.${{ github.run_number }}" \
            --notes "$NOTES"

