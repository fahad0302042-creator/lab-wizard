name: lab_wizard_v2
description: "Lab Wizard — instrument-panel chemistry lab inventory."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.17.2
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  intl: ^0.20.3
  uuid: ^4.6.0
  animations: ^3.0.0
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  collection: ^1.19.1
  shared_preferences: ^2.5.5
  # Range rather than a caret: the low-stock warning only needs the stable
  # show/request-permission surface, which has not moved across these majors.
  flutter_local_notifications: ">=17.0.0 <20.0.0"
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# IBM Plex, bundled rather than fetched. Two families, both OFL:
#
#  * Plex Sans reads names, prose and buttons.
#  * Plex Mono reads anything the app measures: quantities, units, formulas,
#    states and dates. Formulas are mono because "HCl" must never be mistaken
#    for "HCI" at 12 dp.
#
# Static weights rather than the variable font: Flutter matches static faces to
# FontWeight reliably, and an unmatched variable axis is how a design ends up
# rendering everything at 400.
flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    # Styles outside a declared weight are drawn from the 700 face, so 600 and
    # 700 deliberately share SemiBold: bolder, never synthetic.
    - family: PlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#080C14"
  adaptive_icon_foreground: assets/images/logo.png
  min_sdk_android: 23
