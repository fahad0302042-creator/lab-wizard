name: lab_wizard_v2
description: "Lab Wizard 2 — rebuild of the chemistry lab inventory app."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.17.2
  sqflite: ^2.4.4
  path: ^1.9.1
  path_provider: ^2.1.6
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  intl: ^0.20.3
  uuid: ^4.6.0
  animations: ^3.0.0
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  collection: ^1.19.1
  shared_preferences: ^2.5.5
  # Range rather than a caret: the low-stock warning only needs the stable
  # show/request-permission surface, which has not moved across these majors.
  flutter_local_notifications: ">=17.0.0 <20.0.0"
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Same bundled OFL fonts as the first app, so the redesign keeps a warm,
# hand-set character without needing the network.
flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
          weight: 400
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf
          weight: 400
        - asset: assets/fonts/Caveat-Variable.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  image_path: assets/images/logo.png
  adaptive_icon_background: "#FBF7EC"
  adaptive_icon_foreground: assets/images/logo.png
  min_sdk_android: 23
